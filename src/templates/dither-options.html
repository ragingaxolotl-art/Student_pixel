<div
  id="dither-options"
  class="dither-options"
  hidden
  aria-label="Dither options"
>
  <button
    type="button"
    class="dither-compact"
    aria-expanded="false"
    aria-controls="dither-controls"
  >
    Dither options ▾
  </button>
  <div id="dither-controls" class="dither-controls">
    <div
      class="dither-paint-modes"
      role="group"
      aria-label="Dither application"
    >
      <button
        type="button"
        data-dither-paint="pen"
        aria-label="Dither pen"
        aria-pressed="true"
        title="Brush the selected dither"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m4 16 11-11 4 4-11 11-5 1zM13 7l4 4" />
        </svg>
      </button>
      <button
        type="button"
        data-dither-paint="bucket"
        aria-label="Dither bucket"
        aria-pressed="false"
        title="Fill a connected region with dither"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="m5 7 7-4 8 10-8 7-9-9zM3 11h15M7 3l9 10M20 16s-3 3-3 4a3 3 0 0 0 6 0c0-1-3-4-3-4z"
          />
        </svg>
      </button>
    </div>
    <div class="dither-field dither-pattern-field">
      <span>Pattern</span>
      <div class="dither-pattern-row">
        <button
          type="button"
          class="dither-pattern-trigger"
          aria-label="Dither pattern"
          aria-haspopup="dialog"
          aria-controls="dither-pattern-menu"
          aria-expanded="false"
        >
          <canvas width="16" height="8" aria-hidden="true"></canvas
          ><span aria-hidden="true">▾</span>
        </button><button
          type="button"
          class="dither-favorite-toggle"
          aria-label="Add current pattern to favorites"
          aria-pressed="false"
          title="Favorite this pattern"
        >
          ☆
        </button>
      </div>
    </div>
    <label class="dither-field dither-favorites-field"
      >Favorites<select aria-label="Dither favorites">
        <option value="">No favorites yet</option>
      </select></label
    >
    <div class="dither-field dither-density-field">
      <button
        type="button"
        class="dither-density-mode"
        aria-label="Use adjustable dither density"
        aria-pressed="false"
        title="Adjustable ordered density replaces the pattern. Choose a pattern to switch back."
      >
        Density
      </button>
      <div class="dither-density-control">
        <input
          type="range"
          id="dither-density"
          min="0"
          max="100"
          step="1"
          value="50"
          data-dither-setting="density"
          aria-label="Dither density"
          title="Primary color density (0–100%). Overrides the selected pattern."
        >
        <output for="dither-density" class="dither-density-value">50%</output>
      </div>
    </div>
    <label class="dither-field dither-scale-field"
      >Scale<select
        data-dither-setting="scale"
        aria-label="Dither pattern scale"
      >
        <option value="1">1 px</option>
        <option value="2">2 px</option>
        <option value="4">4 px</option>
      </select></label
    >
    <label class="dither-field dither-colors-field"
      >Colors<select data-dither-setting="colors" aria-label="Dither colors">
        <option value="both">Both colors</option>
        <option value="primary">Primary only</option>
      </select></label
    >
    <button
      type="button"
      class="dither-gradient-button"
      data-dither-gradient
      aria-label="Dither gradient settings"
      aria-pressed="false"
      aria-expanded="false"
    >
      Gradient ▾
    </button>
  </div>
  <div
    id="dither-pattern-menu"
    class="dither-pattern-menu"
    hidden
    role="dialog"
    aria-label="Choose dither pattern"
  ></div>
  <span class="dither-announcement" role="status" aria-live="polite"></span>
</div>
