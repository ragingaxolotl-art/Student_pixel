<section class="toolbox-container studio-panel" aria-label="Animation studios">
  <h3 class="toolbox-title">Studios</h3>
  <div class="studio-launchers">
    <button
      type="button"
      class="studio-launcher"
      data-open-puppet
      aria-label="Puppet Studio"
      title="Puppet Studio"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="4" r="2" />
        <path d="M12 6v7M5 9l7 2 7-2M12 13l-5 7m5-7 5 7" />
        <circle cx="5" cy="9" r="1" />
        <circle cx="19" cy="9" r="1" />
        <circle cx="12" cy="13" r="1" />
      </svg>
    </button>
    <button
      type="button"
      class="studio-launcher"
      data-open-particles
      aria-label="Particle Studio"
      title="Particle Studio"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 19l5-6M6 19l10-3M6 19l2-11" />
        <path d="M16 3v5m-2.5-2.5h5M20 10v4m-2-2h4" />
        <rect x="3" y="3" width="2" height="2" />
        <rect x="18" y="19" width="2" height="2" />
        <circle cx="12" cy="12" r="1.5" />
      </svg>
    </button>
    <button
      type="button"
      class="studio-launcher"
      data-open-tiles
      aria-label="Tile Studio"
      title="Tile Studio"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
        <path d="M14 14h7v7h-7zM6 3v7M3 6h7" />
      </svg>
    </button>
  </div>
</section>
