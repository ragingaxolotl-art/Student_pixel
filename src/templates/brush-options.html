<div id="brush-options" class="brush-options" aria-label="Brush options" hidden>
  <button
    type="button"
    class="brush-compact"
    aria-expanded="false"
    aria-controls="brush-controls"
  >
    Brush options ▾
  </button>
  <div id="brush-controls" class="brush-controls">
    <div class="brush-library-group">
      <span>Brush</span>
      <button
        type="button"
        class="brush-library-trigger"
        aria-label="Brush library"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="brush-library-menu"
      >
        <canvas width="16" height="16" aria-hidden="true"></canvas
        ><span class="brush-tip-name">Square</span>
        ▾
      </button>
      <div
        id="brush-library-menu"
        class="brush-library-menu"
        role="dialog"
        aria-label="Brush library"
        hidden
      >
        <strong>Brush library · 36 tips</strong>
        <input
          type="search"
          class="brush-library-search"
          aria-label="Search brushes"
          placeholder="Search brushes…"
        >
        <p class="brush-library-empty" role="status" hidden>
          No brushes match your search.
        </p>
        <div class="brush-tip-grid"></div>
        <p>Tips use the current brush size and paint opacity.</p>
      </div>
    </div>
    <div class="brush-size-group">
      <span>Brush size</span>
      <div class="brush-size-row">
        <div class="brush-presets"></div>
        <input
          type="number"
          min="1"
          max="32"
          step="1"
          aria-label="Brush size (pixels)"
        >
      </div>
    </div>
    <label class="brush-opacity-group"
      >Paint opacity
      <div class="brush-opacity-row">
        <input
          type="range"
          min="0"
          max="100"
          step="1"
          value="100"
          aria-label="Brush opacity"
        ><output>100%</output>
      </div></label
    >
  </div>
</div>
