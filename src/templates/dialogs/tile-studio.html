<script type="text/template" id="templates/dialogs/tile-studio.html">
<div class="dialog-wrapper tile-dialog" role="dialog" aria-label="Tile Studio">
 <header class="tile-heading"><strong class="dialog-title">Tile Studio</strong><span class="tile-subtitle">Draw a piece. Build a world.</span><button type="button" data-tile-action="undo">Undo</button><button type="button" data-tile-action="redo">Redo</button><button type="button" class="dialog-close" aria-label="Close Tile Studio">×</button></header>
 <nav class="tile-stagebar" aria-label="Tile Studio stages"><button type="button" data-tile-stage="tiles">1 · Tiles</button><button type="button" data-tile-stage="map">2 · Map</button><label>Zoom <select data-tile-field="zoom" aria-label="Tile canvas zoom"><option value="fit">Fit</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></label><label><input type="checkbox" data-tile-field="grid" checked> Grid</label><button type="button" data-tile-action="save">Save to project</button><button type="button" data-tile-action="download-project">Download project (.piskel)</button></nav>
 <div class="tile-workspace">
  <section class="tile-tools" data-tile-panel="Tools"><h4>Tools</h4><div class="tile-tool-list"></div><div class="tile-paint-options"><label>Primary <input type="color" data-tile-field="color" value="#74b85c" aria-label="Tile paint color"></label><label>Secondary <input type="color" data-tile-field="secondary" value="#ffffff" aria-label="Tile secondary color"></label><button type="button" data-tile-action="swap">Swap colors · X</button><label>Brush size <input type="number" data-tile-field="brush-size" aria-label="Tile brush size" min="1" max="32" value="1"></label><label>Opacity <input type="range" data-tile-field="opacity" aria-label="Tile paint opacity" min="0" max="100" value="100"><output data-tile-opacity>100%</output></label></div><label><input type="checkbox" data-tile-field="wrap" checked> Wrap edges</label><div class="tile-map-controls"><button type="button" data-tile-action="flip">Flip ↔</button><button type="button" data-tile-action="rotate">Rotate ↻</button><span data-tile-transform></span></div></section>
  <section class="tile-viewer" data-tile-panel="Canvas"><h4><span data-tile-canvas-heading>Tile canvas</span></h4><div class="tile-viewport"><button type="button" class="tile-start" data-tile-action="start">+ Create a tile to start drawing</button><canvas class="tile-canvas" aria-label="Tile Studio canvas" tabindex="0"></canvas></div><p class="tile-hint"></p></section>
  <aside class="tile-side">
   <section class="tile-tileset" data-tile-panel="Tileset"><h4>Tileset</h4><div class="tile-tile-list" aria-label="Tileset tiles"></div><div class="tile-row"><button type="button" data-tile-action="new">+ Tile</button><button type="button" data-tile-action="duplicate">Duplicate</button></div></section>
   <section class="tile-layers" data-tile-panel="Layers"><h4>Map layers · top in front</h4><div class="tile-layer-list"></div><div class="tile-row"><button type="button" data-tile-action="add-layer">+ Layer</button><button type="button" data-tile-action="layer-up" aria-label="Move map layer up">↑</button><button type="button" data-tile-action="layer-down" aria-label="Move map layer down">↓</button><button type="button" data-tile-action="delete-layer">Delete layer</button></div></section>
  </aside>
  <section class="tile-properties" data-tile-panel="Properties"><h4>Properties</h4><label>Tile name <input data-tile-field="name" maxlength="80"></label><div class="tile-row tile-resolution-controls"><label>Tile resolution <input type="number" data-tile-field="size" min="1" max="128" value="16" aria-label="Tile resolution"></label><label>Resize method <select data-tile-field="resample" aria-label="Tile resize method"><option value="scale">Scale artwork · crisp pixels</option><option value="canvas">Canvas size · expand / crop</option></select></label><button type="button" data-tile-action="size">Apply resolution</button></div><p>Resolution applies to every tile. Scaling uses nearest-neighbor pixels; canvas resize keeps the top-left artwork. Undo restores the previous resolution.</p><div class="tile-row"><label>Map columns <input type="number" data-tile-field="width" min="1" max="128"></label><label>Map rows <input type="number" data-tile-field="height" min="1" max="128"></label><button type="button" data-tile-action="resize">Resize map</button></div><div class="tile-row"><label>Artwork source <select data-tile-field="source" aria-label="Tile artwork source"><option value="frame">Current layer / frame</option><option value="selection">Current selection</option></select></label><button type="button" data-tile-action="artwork">Slice artwork</button><button type="button" data-tile-action="image">Import PNG</button></div><div class="tile-selection-controls tile-row"><button type="button" data-tile-action="copy">Copy selection</button><button type="button" data-tile-action="cut">Cut / move</button><button type="button" data-tile-action="stamp">Save stamp</button><button type="button" data-tile-action="unique">Make unique</button><button type="button" data-tile-action="clear">Clear selection</button></div><label>Stamps <select data-tile-field="stamp" aria-label="Saved tile stamps"><option value="">Choose a stamp</option></select></label><div class="tile-row"><button type="button" data-tile-action="map-png">Map PNG</button><button type="button" data-tile-action="tiles-png">Tileset PNG</button><button type="button" data-tile-action="export">Export tiles only (JSON)</button><button type="button" data-tile-action="import">Import JSON</button></div><input type="file" class="tile-image-file" accept="image/png" hidden><input type="file" class="tile-json-file" accept=".json,application/json" hidden></section>
  <section class="tile-draw-layers" data-tile-panel="Tile layers"><h4>Tile drawing layers · top in front</h4><div class="tile-draw-layer-list"></div><div class="tile-row"><button type="button" data-tile-action="tile-layer-add">+ Drawing layer</button><button type="button" data-tile-action="tile-layer-up">↑</button><button type="button" data-tile-action="tile-layer-down">↓</button><button type="button" data-tile-action="tile-layer-delete">Delete drawing layer</button></div></section>
  <section class="tile-drawing" data-tile-panel="Drawing"><h4>Drawing options</h4><label>Shape <select data-tile-field="shape-mode" aria-label="Tile shape fill"><option value="fill-only">Filled</option><option value="empty">Outline</option><option value="filled">Fill + outline</option></select></label><label>Outline width <input type="number" data-tile-field="outline-width" aria-label="Tile outline width" value="1" min="1" max="16"></label><p>Primary draws outlines. Secondary fills shapes with outlines. Hold Shift for circles and squares.</p><label><input type="checkbox" data-tile-field="dither"> Dither paint / fill / shapes</label><label>Pattern <select data-tile-field="pattern" aria-label="Tile dither pattern"></select></label><label>Dither mode <select data-tile-field="dither-mode" aria-label="Tile dither mode"><option value="pattern">Pattern</option><option value="density">Density</option></select></label><label>Density <input type="range" data-tile-field="density" aria-label="Tile dither density" min="0" max="100" value="50"></label><label>Pattern scale <input type="number" data-tile-field="pattern-scale" aria-label="Tile pattern scale" min="1" max="8" value="1"></label></section>
  <section class="tile-palette" data-tile-panel="Palette"><h4>Palette</h4><label>Palette <select data-tile-field="palette" aria-label="Tile palette"></select></label><div class="tile-swatches" aria-label="Tile palette colors"></div><p>Click a swatch for primary; right-click for secondary.</p></section>
  <section class="tile-preview" data-tile-panel="Preview"><h4><span data-tile-preview-heading>Seam preview · 3 × 3</span></h4><label class="tile-repeat-control">Repeat preview <input type="number" data-tile-field="repeats" aria-label="Tile preview repeat count" min="1" max="9" value="3"></label><canvas aria-label="Tile Studio preview"></canvas></section>
  <section class="tile-tutorials" data-tile-panel="Tutorials"><h4>Tutorials</h4><select data-tile-field="tutorial" aria-label="Tile Studio tutorial"><option value="seam">Make a seamless tile</option><option value="world">Build a map</option><option value="stamp">Make a reusable stamp</option></select><p class="tile-tutorial-text"></p></section>
 </div>
 <footer class="tile-footer"><span role="status" aria-live="polite"></span><span>Ctrl/Cmd+Z undo · Shift+Z redo · B brush · E erase · S select</span></footer>
</div>
</script>
